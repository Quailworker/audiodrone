# Local safety caps (added for this machine, not part of the Zetaris bundle). Compose reads this file
# automatically next to docker-compose.yml. Hard memory limits with no swap, so the stack can never take
# the desktop's RAM: about 10 GB at most in total, about 3 GB typical (the .env sizing). The limits sit
# above each JVM heap in .env (driver 2g, API 1g) to leave room for off-heap memory.
services:
  postgres:
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
  init:
    mem_limit: 1g
    memswap_limit: 1g
  driver:
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 4
  api:
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
  ui:
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1
    # The bundle publishes the web UI on every interface; we keep the default admin password, so this
    # machine only (the README's localhost case). !override replaces the list instead of adding to it.
    ports: !override
      - "127.0.0.1:${UI_PORT:-3000}:3000"
  bootstrap:
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1
